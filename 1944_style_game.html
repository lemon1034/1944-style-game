<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1944: The Ultimate 20 Stages</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        #arcade-cabinet { position: relative; background: #111; padding: 15px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,1); border: 2px solid #222; }
        canvas { display: block; image-rendering: pixelated; box-shadow: inset 0 0 20px #000; }
        .controls { margin-top: 10px; font-size: 10px; color: #94a3b8; text-align: center; line-height: 2; }
        .controls span { color: #38bdf8; font-weight: bold; }
        .controls .bomb-key { color: #ef4444; }
    </style>
</head>
<body>
    <div id="arcade-cabinet"><canvas id="gameCanvas" width="540" height="720"></canvas></div>
    <div class="controls">MOVE: <span>ARROWS</span> | FIRE: <span>Z / SPACE</span> | BOMB: <span class="bomb-key">X</span> | START: <span>ENTER</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false;

        // --- 1. 팔레트 & 실존 기종 도트 데이터 ---
        const PALETTE = {
            '.': null, 'S': '#e2e8f0', 's': '#94a3b8', 'b': '#3b82f6', 'B': '#1e3a8a', // 머스탱(미국)
            'g': '#4d5c39', 'G': '#3a4729', 'y': '#facc15', 'R': '#b91c1c', 'k': '#111', // 일본군
            'w': '#ffffff', 'C': '#0ea5e9', 'A': '#78716c', 'a': '#44403c', 'O': '#f97316'
        };

        const MAPS = {
            // P-51 머스탱 (미국) - 은빛 동체와 파란색 노즈
            p51: { s: 3, d: [".......b.......","......bBb......",".....sbbbs.....","....sSbbBSs....","....SSSSSBS....","..ssSSSBSss..",".sSSSSSSSBSs.","sSSSSSsSSSSSs","..SSSSSBSss..","....S.S.S....","......S........",".....sSs.....","....sSRSs....","......S........"] },
            // 1. A6M Zero (전투기 - 기본)
            zero: { s: 3, d: [".......R.......",".....ggRgg.....","....gggCggg....","...ggggCgggg...","..GggggGggggG..",".GGGgggGgggGGG.","RggGggGgGggGggR","....gggGggg....",".....ggGgg.....",".......G......."] },
            // 2. Ki-43 Oscar (경전투기 - 빠름)
            oscar: { s: 3, d: [".......g.......","......gCg......",".....ggCgg.....","...GgggCgggG...","..GgGggGggGgG..","GgggGGgGgGGgggG","RgggggGgGgggggR",".......G.......","......gGg......"] },
            // 3. Ki-61 Hien (전투기 - 은색/내구도 높음)
            hien: { s: 3, d: [".......A.......","......ACA......",".....AACA......","...AAACCAAA...","..AAAAaAaAAAA..",".aAAAaAaAaAAAa.","RAAaAaAaAaAaAAR","....AaaAaaA....",".....AAaAA.....",".......a......."] },
            // 4. D3A Val (급강하 폭격기 - 조준탄)
            val: { s: 3, d: [".......G.......",".....GgCgG.....","....GggCggG....",".GGGgggCgggGGG.","GgggggGgGgggggG","RggGggGgGggGggR","..GgGgggggGgG..",".......G.......",".....GgGgG....."] },
            // 5. B5N Kate (뇌격기 - 넓은 탄막)
            kate: { s: 3, d: [".......G.......","......gCg......","...GGGgCgGGG...","..GggggCggggG..","GgggggGgGgggggG","RgggggGgGgggggR","..GGgggGgggGG..",".......G.......","......GgG......",".....GgGgG....."] },
            // 6. G4M Betty (쌍발 폭격기 - 중간 보스급)
            betty: { s: 4, d: [".......G.......","......GcG......",".....GgCgG.....","...GGggCggGG...","..GggGgCgGggG..",".GgggGGgGGgggG.","GggRgggGgggRggG",".GgggggGgggggG.",".......G.......","......GgG......",".....GGgGG....."] },
            // 7. J7W Shinden (엔드급 요격기 - 후방 프로펠러, 역익기)
            shinden: { s: 3, d: [".......G.......",".....GGgGG.....",".......G.......","......gCg......",".GGGGGgCgGGGGG.","GggggggCggggggG","RgggggGgGgggggR","....GGgGgGG....","...GGggGggGG...","..G...gGg...G.."] },
        };

        const SPRITES = {};
        for (let k in MAPS) {
            let m = MAPS[k], w = m.d[0].length * m.s, h = m.d.length * m.s;
            let c = document.createElement('canvas'); c.width = w; c.height = h;
            let cx = c.getContext('2d');
            for(let y=0; y<m.d.length; y++) for(let x=0; x<w/m.s; x++) {
                if(PALETTE[m.d[y][x]]) { cx.fillStyle=PALETTE[m.d[y][x]]; cx.fillRect(x*m.s, y*m.s, m.s, m.s); }
            }
            SPRITES[k] = { img: c, w: w, h: h };
        }

        // --- 2. 코어 시스템 및 상태 ---
        let state = 'TITLE', frame = 0, score = 0, stage = 1;
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        let player, bullets, eBullets, enemies, items, particles, bgElements, boss;

        // 지형 생성 (육지/바다/구름)
        function initBG() {
            bgElements = { islands: [], clouds: [], waves: [] };
            for(let i=0; i<8; i++) bgElements.islands.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*80+40, c: ['#064e3b','#065f46','#14532d'][i%3] });
        }

        function initGame() {
            state = 'PLAYING'; frame = 0; score = 0; stage = 1;
            player = { x: canvas.width/2-20, y: canvas.height-100, w: SPRITES.p51.w, h: SPRITES.p51.h, hp: 100, max: 100, lives: 3, power: 1, bombs: 3, inv: 60, cool: 0 };
            bullets = []; eBullets = []; enemies = []; items = []; particles = []; boss = null;
            initBG();
        }

        // --- 3. 극강의 물리/렌더링 파티클 시스템 ---
        function explode(x, y, power, color) {
            // Flash
            particles.push({ x, y, type: 'flash', life: 5, max: 5, r: power*2 });
            // Debris
            for(let i=0; i<power*1.5; i++) {
                let a = Math.random() * Math.PI * 2, v = Math.random() * (power*0.2);
                particles.push({ 
                    x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, type: 'debris',
                    life: Math.random()*30+20, size: Math.random() > 0.8 ? 4 : 2,
                    c: color || ['#ffffff','#fde047','#f97316','#dc2626','#44403c'][Math.floor(Math.random()*5)]
                });
            }
            // Smoke rings
            for(let i=0; i<power/2; i++) {
                let a = Math.random() * Math.PI * 2, v = Math.random() * (power*0.05);
                particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, type: 'smoke', life: 40+Math.random()*20, size: Math.random()*15+10 });
            }
        }

        // --- 4. 20 스테이지 보스 제네레이터 ---
        function spawnBoss(stg) {
            let bw = 80 + (stg * 6), bh = 60 + (stg * 3);
            let color = stg % 5 === 0 ? '#b91c1c' : stg % 3 === 0 ? '#4d5c39' : '#1e293b'; // 스테이지별 보스 색상
            let turrets = [];
            for(let i=0; i<2 + Math.floor(stg/3); i++) {
                turrets.push({ dx: (bw/(2+Math.floor(stg/3))) * i + 20, dy: bh - 10, cool: Math.random()*50, type: i%2===0?'aim':'spread' });
            }
            boss = { x: canvas.width/2 - bw/2, y: -bh, w: bw, h: bh, hp: 2000 + (stg * 1500), maxHp: 2000 + (stg * 1500), c: color, phase: 0, turrets, timer: 0 };
        }

        // --- 5. 다양한 탄막 패턴 ---
        function fireEnemy(e, type) {
            let px = player.x + player.w/2, py = player.y + player.h/2;
            let ex = e.x + e.w/2, ey = e.y + e.h;
            let a = Math.atan2(py - ey, px - ex);

            if (type === 'aim') { eBullets.push({ x: ex, y: ey, vx: Math.cos(a)*5, vy: Math.sin(a)*5, s: 6, c: '#facc15', shape: 'arc' }); }
            if (type === 'spread') {
                for(let i=-1; i<=1; i++) eBullets.push({ x: ex, y: ey, vx: Math.cos(a+i*0.3)*4, vy: Math.sin(a+i*0.3)*4, s: 6, c: '#f97316', shape: 'arc' });
            }
            if (type === 'ring') {
                for(let i=0; i<12+(stage); i++) {
                    let ra = (Math.PI*2/ (12+stage)) * i;
                    eBullets.push({ x: ex, y: ey, vx: Math.cos(ra)*3.5, vy: Math.sin(ra)*3.5, s: 8, c: '#ef4444', shape: 'rect' });
                }
            }
        }

        // --- 6. 7종 적기 스폰 로직 ---
        const ENEMY_TYPES = ['zero', 'oscar', 'hien', 'val', 'kate', 'betty', 'shinden'];
        function spawnEnemies() {
            if (boss || frame % Math.max(20, 60 - stage*2) !== 0) return;
            
            // 스테이지에 따라 나오는 적 종류 해금
            let maxTypeIndex = Math.min(6, Math.floor(stage / 3) + 1);
            let type = ENEMY_TYPES[Math.floor(Math.random() * maxTypeIndex)];
            let x = Math.random() * (canvas.width - 50);
            
            let e = { x, y: -50, w: SPRITES[type].w, h: SPRITES[type].h, type: type, hp: 30 + stage*10, timer: 0, vx: 0, vy: 2 };
            
            if (type === 'oscar') e.vy = 4;
            if (type === 'hien') { e.hp *= 2; e.vy = 1.5; }
            if (type === 'betty') { e.hp *= 4; e.vx = Math.random()>0.5?1:-1; e.vy = 1; e.w=SPRITES.betty.w; e.h=SPRITES.betty.h; }
            if (type === 'shinden') { e.vy = 3; e.hp *= 1.5; }

            enemies.push(e);

            if (frame > 0 && frame % 2000 === 0) spawnBoss(stage); // 보스 등장 조건
        }

        function checkHit(r1, r2) { return r1.x < r2.x + (r2.w||r2.s) && r1.x + (r1.w||r1.s) > r2.x && r1.y < r2.y + (r2.h||r2.s) && r1.y + (r1.h||r1.s) > r2.y; }

        // --- 7. 메인 루프 ---
        function update() {
            if(state !== 'PLAYING') return;
            frame++;

            // 배경 애니메이션
            bgElements.islands.forEach(isl => isl.y += 0.5);
            bgElements.islands = bgElements.islands.filter(isl => isl.y < canvas.height + isl.r);
            if(frame%150===0) bgElements.islands.push({ x: Math.random()*canvas.width, y: -100, r: Math.random()*80+40, c: ['#064e3b','#065f46','#14532d'][Math.floor(Math.random()*3)] });

            if (keys.ArrowUp && player.y > 0) player.y -= 6;
            if (keys.ArrowDown && player.y < canvas.height-player.h) player.y += 6;
            if (keys.ArrowLeft && player.x > 0) player.x -= 6;
            if (keys.ArrowRight && player.x < canvas.width-player.w) player.x += 6;
            if (player.inv > 0) player.inv--;

            // 머스탱 사격 (파란색 예광탄)
            if (player.cool > 0) player.cool--;
            if ((keys.Space || keys.KeyZ) && player.cool === 0) {
                let px = player.x+player.w/2, py = player.y;
                bullets.push({ x: px-10, y: py, w: 4, h: 24, vx: 0, vy: -25, dmg: 15, c: '#3b82f6' });
                bullets.push({ x: px+6, y: py, w: 4, h: 24, vx: 0, vy: -25, dmg: 15, c: '#3b82f6' });
                if(player.power >= 2) {
                    bullets.push({ x: px-25, y: py+10, w: 4, h: 20, vx: -2, vy: -22, dmg: 12, c: '#facc15' });
                    bullets.push({ x: px+21, y: py+10, w: 4, h: 20, vx: 2, vy: -22, dmg: 12, c: '#facc15' });
                }
                if(player.power >= 3) {
                    bullets.push({ x: px-35, y: py+20, w: 6, h: 20, vx: -4, vy: -20, dmg: 10, c: '#ef4444' });
                    bullets.push({ x: px+29, y: py+20, w: 6, h: 20, vx: 4, vy: -20, dmg: 10, c: '#ef4444' });
                }
                player.cool = 5;
            }

            // 폭탄 시스템 (화면 전체 융단폭격)
            if (keys.KeyX && player.bombs > 0 && player.inv === 0) {
                player.bombs--; player.inv = 120; eBullets = [];
                for(let i=0; i<30; i++) setTimeout(() => explode(Math.random()*canvas.width, Math.random()*canvas.height, 40), i*40);
                enemies.forEach(e => { e.hp -= 1000; if(e.hp<=0) { score+=200; explode(e.x+e.w/2, e.y+e.h/2, 20); }});
                if(boss) boss.hp -= 2000;
                enemies = enemies.filter(e => e.hp>0);
            }

            bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
            bullets = bullets.filter(b => b.y > -50);
            eBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
            eBullets = eBullets.filter(b => b.y < canvas.height+50 && b.x > -50 && b.x < canvas.width+50);

            // 적 업데이트
            spawnEnemies();
            for(let i = enemies.length-1; i >= 0; i--) {
                let e = enemies[i]; e.y += e.vy; e.x += e.vx; e.timer++;
                
                if (e.x < 0 || e.x > canvas.width - e.w) e.vx *= -1;

                if (e.type === 'val' && e.timer % 60 === 0) fireEnemy(e, 'aim');
                if (e.type === 'kate' && e.timer % 80 === 0) fireEnemy(e, 'spread');
                if (e.type === 'betty' && e.timer % 100 === 0) fireEnemy(e, 'ring');
                if (e.type === 'shinden' && e.timer % 40 === 0) fireEnemy(e, 'aim');

                let pBox = { x: player.x+10, y: player.y+10, w: player.w-20, h: player.h-20 };
                if (player.inv===0 && checkHit(pBox, e)) { hitPlayer(); e.hp -= 100; }

                for(let j=bullets.length-1; j>=0; j--) {
                    if (checkHit(bullets[j], e)) {
                        e.hp -= bullets[j].dmg;
                        particles.push({x:bullets[j].x, y:bullets[j].y, vx:0, vy:0, type:'debris', life:5, size:4, c:'#fff'});
                        bullets.splice(j, 1);
                        if(e.hp <= 0) {
                            score += e.type==='betty'?500:100;
                            explode(e.x+e.w/2, e.y+e.h/2, e.type==='betty'?30:15);
                            if(Math.random() < (e.type==='betty'?0.8:0.05)) items.push({x:e.x, y:e.y, w:20, h:20, t:['P','B','H'][Math.floor(Math.random()*3)], vy:2});
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
            }

            // 보스 업데이트
            if (boss) {
                boss.timer++;
                if (boss.y < 50) boss.y += 1;
                else {
                    boss.x += Math.sin(boss.timer * 0.02) * (2 + stage*0.2);
                    boss.turrets.forEach((t, idx) => {
                        t.cool--;
                        if(t.cool <= 0) {
                            fireEnemy({x: boss.x+t.dx-10, y: boss.y+t.dy, w:20, h:20}, t.type);
                            t.cool = 60 - Math.min(40, stage*2); // 스테이지 높을수록 탄막 지옥
                            if (boss.hp < boss.maxHp/2 && Math.random()<0.3) fireEnemy({x: boss.x+boss.w/2, y: boss.y+boss.h}, 'ring');
                        }
                    });
                }

                for(let j=bullets.length-1; j>=0; j--) {
                    if(checkHit(bullets[j], boss)) {
                        boss.hp -= bullets[j].dmg;
                        particles.push({x:bullets[j].x, y:bullets[j].y, vx:Math.random()*4-2, vy:-2, type:'debris', life:10, size:4, c:'#facc15'});
                        bullets.splice(j, 1);
                        if(boss.hp <= 0) {
                            score += stage * 5000;
                            explode(boss.x+boss.w/2, boss.y+boss.h/2, 100);
                            for(let k=0; k<5; k++) items.push({x:boss.x+Math.random()*boss.w, y:boss.y+Math.random()*boss.h, w:20, h:20, t:['P','P','B','H','H'][k], vy:2});
                            boss = null;
                            if(stage < 20) { stage++; player.hp = Math.min(player.max, player.hp+50); }
                            else { state = 'CLEAR'; } // 20스테이지 클리어!
                            break;
                        }
                    }
                }
            }

            // 적 탄막 충돌
            let pBox = { x: player.x+12, y: player.y+12, w: player.w-24, h: player.h-24 };
            for(let i=eBullets.length-1; i>=0; i--) {
                if(player.inv===0 && checkHit(pBox, eBullets[i])) { hitPlayer(); eBullets.splice(i,1); }
            }

            // 아이템 획득
            for(let i=items.length-1; i>=0; i--) {
                items[i].y += items[i].vy;
                if(checkHit(pBox, items[i])) {
                    if(items[i].t==='P') player.power = Math.min(3, player.power+1);
                    if(items[i].t==='B') player.bombs = Math.min(5, player.bombs+1);
                    if(items[i].t==='H') player.hp = Math.min(player.max, player.hp+40);
                    score += 500; items.splice(i, 1);
                } else if(items[i].y > canvas.height) items.splice(i,1);
            }

            // 파티클 업데이트
            particles.forEach(p => { 
                p.x+=p.vx||0; p.y+=p.vy||0; p.life--; 
                if(p.type==='smoke') { p.size+=0.5; p.vx*=0.9; p.vy*=0.9; }
                if(p.type==='debris') { p.vy+=0.1; /* Gravity */ p.vx*=0.98; }
            });
            particles = particles.filter(p => p.life>0);
        }

        function hitPlayer() {
            player.hp -= 25; player.power = Math.max(1, player.power-1); player.inv = 60;
            explode(player.x+player.w/2, player.y+player.h/2, 15);
            if(player.hp <= 0) {
                player.lives--;
                if(player.lives < 0) state = 'GAMEOVER';
                else { player.hp = 100; player.bombs = 3; player.x = canvas.width/2; player.y = canvas.height-100; }
            }
        }

        // --- 8. 렌더링 ---
        function draw() {
            // 바다 배경 (그라데이션 도트 느낌)
            ctx.fillStyle = '#020617'; ctx.fillRect(0,0,canvas.width,canvas.height);
            for(let i=0; i<canvas.height; i+=4) {
                ctx.fillStyle = i%8===0 ? '#0f172a' : '#020617'; ctx.fillRect(0, i + (frame*0.5)%8, canvas.width, 4);
            }

            // 섬
            bgElements.islands.forEach(isl => {
                ctx.fillStyle = '#b45309'; ctx.fillRect(isl.x-isl.r-4, isl.y-isl.r/2-4, isl.r*2+8, isl.r+8); // 모래사장
                ctx.fillStyle = isl.c; ctx.fillRect(isl.x-isl.r, isl.y-isl.r/2, isl.r*2, isl.r);
            });

            if(state === 'TITLE') {
                ctx.fillStyle = '#38bdf8'; ctx.font = '36px "Press Start 2P"'; ctx.textAlign='center'; ctx.fillText('1944', canvas.width/2, 300);
                ctx.fillStyle = '#fff'; ctx.font = '14px "Press Start 2P"'; ctx.fillText('ULTIMATE 20 STAGES', canvas.width/2, 340);
                if(frame%60<30) { ctx.fillStyle = '#ef4444'; ctx.fillText('PRESS ENTER', canvas.width/2, 450); }
                frame++; return;
            }

            // 보스 렌더링 (절차적 생성 기반 격자 도트)
            if(boss) {
                ctx.fillStyle = boss.c; ctx.fillRect(boss.x, boss.y, boss.w, boss.h); // 몸체
                ctx.fillStyle = '#000'; ctx.fillRect(boss.x+10, boss.y+10, boss.w-20, boss.h-20); // 내부 데칼
                boss.turrets.forEach(t => {
                    ctx.fillStyle = '#475569'; ctx.fillRect(boss.x+t.dx-10, boss.y+t.dy-10, 20, 20); // 포탑 베이스
                    ctx.fillStyle = '#000'; ctx.fillRect(boss.x+t.dx-4, boss.y+t.dy, 8, 15); // 포신
                });
                // 보스 체력바
                ctx.fillStyle='#111'; ctx.fillRect(boss.x, boss.y-15, boss.w, 6);
                ctx.fillStyle='#ef4444'; ctx.fillRect(boss.x, boss.y-15, boss.w*(boss.hp/boss.maxHp), 6);
            }

            // 적 렌더링
            enemies.forEach(e => {
                ctx.drawImage(SPRITES[e.type].img, e.x, e.y);
                // 엔진 화염 (shinden은 뒤, 나머지는 앞)
                if(frame%4<2) {
                    ctx.fillStyle='#f97316'; 
                    if(e.type==='shinden') ctx.fillRect(e.x+e.w/2-3, e.y-8, 6, 8);
                    else ctx.fillRect(e.x+e.w/2-3, e.y+e.h, 6, 8);
                }
            });

            // 플레이어 렌더링
            if(player.inv%6<3) {
                ctx.drawImage(SPRITES.p51.img, player.x, player.y);
                if(keys.ArrowUp) { ctx.fillStyle='#38bdf8'; ctx.fillRect(player.x+player.w/2-3, player.y+player.h, 6, 12); } // 추진기
            }

            // 아이템
            items.forEach(it => {
                ctx.fillStyle = it.t==='H'?'#22c55e':it.t==='P'?'#ef4444':'#facc15';
                ctx.fillRect(it.x, it.y, it.w, it.h);
                ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.font='12px "Press Start 2P"'; ctx.fillText(it.t, it.x+it.w/2, it.y+it.h/2+4);
            });

            // 탄막
            bullets.forEach(b => { ctx.fillStyle=b.c; ctx.fillRect(b.x, b.y, b.w, b.h); });
            eBullets.forEach(b => {
                ctx.fillStyle = b.c;
                if(b.shape==='arc') { ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, Math.PI*2); ctx.fill(); }
                else ctx.fillRect(Math.floor(b.x-b.s/2), Math.floor(b.y-b.s/2), b.s, b.s);
                ctx.fillStyle='#fff'; ctx.fillRect(Math.floor(b.x-2), Math.floor(b.y-2), 4, 4);
            });

            // 극한의 파티클 렌더링
            particles.forEach(p => {
                if(p.type==='flash') {
                    ctx.fillStyle = `rgba(255,255,255,${p.life/p.max})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                } else if(p.type==='smoke') {
                    ctx.fillStyle = `rgba(30,30,30,${p.life/60})`;
                    let px = Math.floor(p.x/2)*2, py = Math.floor(p.y/2)*2;
                    ctx.fillRect(px-p.size/2, py-p.size/2, p.size, p.size);
                } else {
                    ctx.fillStyle = p.c;
                    let px = Math.floor(p.x/2)*2, py = Math.floor(p.y/2)*2;
                    ctx.fillRect(px, py, p.size, p.size);
                }
            });

            // 상단 UI
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,40);
            ctx.fillStyle = '#fff'; ctx.font='12px "Press Start 2P"'; ctx.textAlign='left';
            ctx.fillText(`SCORE: ${score.toString().padStart(7,'0')}`, 10, 25);
            ctx.fillStyle = '#38bdf8'; ctx.textAlign='right'; ctx.fillText(`STAGE ${stage}/20`, canvas.width-10, 25);

            // 하단 UI
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,canvas.height-40,canvas.width,40);
            ctx.fillStyle = '#333'; ctx.fillRect(10, canvas.height-25, 150, 12);
            ctx.fillStyle = player.hp>30?'#22c55e':'#ef4444'; ctx.fillRect(10, canvas.height-25, 150*(Math.max(0,player.hp)/player.max), 12);
            ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='10px "Press Start 2P"'; ctx.fillText('HP', 10, canvas.height-30);
            
            ctx.fillText('BOMB', 180, canvas.height-18);
            for(let i=0; i<player.bombs; i++) { ctx.fillStyle='#ef4444'; ctx.fillRect(220+i*14, canvas.height-25, 10, 10); }
            
            ctx.fillStyle='#fff'; ctx.fillText('LIVES', 320, canvas.height-18);
            for(let i=0; i<player.lives; i++) { ctx.fillStyle='#38bdf8'; ctx.fillRect(365+i*14, canvas.height-25, 10, 10); }
            ctx.fillText(`PWR:${player.power}`, 440, canvas.height-18);

            if(state==='GAMEOVER' || state==='CLEAR') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = state==='CLEAR'?'#facc15':'#ef4444'; ctx.font='32px "Press Start 2P"'; ctx.textAlign='center';
                ctx.fillText(state==='CLEAR'?'MISSION ACCOMPLISHED':'GAME OVER', canvas.width/2, 300);
                if(frame%60<30) { ctx.fillStyle='#fff'; ctx.font='12px "Press Start 2P"'; ctx.fillText('PRESS ENTER TO RESTART', canvas.width/2, 360); }
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        window.onload = loop;
    </script>
</body>
</html>
